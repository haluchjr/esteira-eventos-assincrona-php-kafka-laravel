services:
  # --- WORKER CONSUMIDOR DO KAFKA (Mesmo ambiente PHP, rodando a escuta 24/7) ---
  kafka-consumer:
    container_name: kafka_consumer
    build:
      context: .
      dockerfile: ./docker/php8.3/Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    #command: php artisan kafka:escutar-pedidos
    command: tail -f /dev/null
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - backend
      - kafka
    networks:
      - app-net

  # --- BROKER KAFKA (Modo KRaft) ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '_cwxYTAJTdqiAP6nl6xAMg'
    networks:
      - app-net

  # --- INTERFACE GRÁFICA PARA VER AS MENSAGENS DO KAFKA ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'Cluster-Local'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
    depends_on:
      - kafka
    networks:
      - app-net
  
  
  backend:
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    ports:
      - "8088:80"
    build:
      context: .
      dockerfile: ./docker/php8.3/Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    restart: unless-stopped
    volumes:
      - ./:/var/www/html # Espelha sua pasta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge